name: Branch Docker Image

on:
  push:
    branches:
      - codex/openai-session-audit
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: branch-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive image metadata
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          branch=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
          short_sha=$(echo '${{ github.sha }}' | cut -c1-12)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.branch }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.build_date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=branch-docker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=branch-docker-${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sub2api:${{ steps.meta.outputs.branch }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sub2api:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Publish image summary
        run: |
          {
            echo "## Published Docker image"
            echo
            echo "- \`ghcr.io/${{ steps.meta.outputs.owner }}/sub2api:${{ steps.meta.outputs.branch }}\`"
            echo "- \`ghcr.io/${{ steps.meta.outputs.owner }}/sub2api:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.short_sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
