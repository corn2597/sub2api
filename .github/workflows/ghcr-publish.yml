name: Publish GHCR Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, for example feature/openai-responses-session-audit"
        required: true
        default: "feature/openai-responses-session-audit"
        type: string
      image_tag:
        description: "Docker image tag to publish"
        required: true
        default: "v0.1.135-session-audit.2"
        type: string
      version:
        description: "Version embedded into the binary"
        required: true
        default: "0.1.135-session-audit.2"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $tag" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          sha="$(git rev-parse HEAD)"
          short_sha="${sha:0:8}"

          {
            echo "image=ghcr.io/${owner}/${repo}"
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="${{ inputs.version }}" \
            --build-arg COMMIT="${{ steps.meta.outputs.sha }}" \
            --build-arg DATE="${{ steps.meta.outputs.date }}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}" \
            --label "org.opencontainers.image.version=${{ inputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:${{ inputs.image_tag }}" \
            -t "${{ steps.meta.outputs.image }}:git-${{ steps.meta.outputs.short_sha }}" \
            --push \
            .

      - name: Print image references
        run: |
          echo "${{ steps.meta.outputs.image }}:${{ inputs.image_tag }}"
          echo "${{ steps.meta.outputs.image }}:git-${{ steps.meta.outputs.short_sha }}"
