name: Codex v0.1.185 HTTP2WS Images

on:
  push:
    branches:
      - codex/v0.1.185-http2ws-astra-merge2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Sub2API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sub2api:codex-v0.1.185-http2ws-${{ github.sha }}
          build-args: |
            VERSION=0.1.185-codex.1
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=sub2api-v0185
          cache-to: type=gha,mode=max,scope=sub2api-v0185
          provenance: true
          sbom: true

      - name: Build and push OpenCode egress sidecar
        uses: docker/build-push-action@v6
        with:
          context: ./sidecar/opencode-egress
          file: ./sidecar/opencode-egress/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sub2api-opencode-egress:codex-v0.1.185-http2ws-${{ github.sha }}
          cache-from: type=gha,scope=sub2api-egress-v0185
          cache-to: type=gha,mode=max,scope=sub2api-egress-v0185
          provenance: true
          sbom: true
